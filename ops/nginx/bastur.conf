# =============================================================================
# БасТур — nginx reverse proxy перед Next.js (pm2, 127.0.0.1:3000)
#
# Домены: сейчас testnetnext.top, после переезда — bus-tour.by.
# Просто добавьте/замените server_name и перевыпустите сертификат.
#
# TLS (после наведения DNS на VPS):
#   sudo apt install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d testnetnext.top -d www.testnetnext.top
# certbot сам перепишет этот конфиг под 443 + редирект с 80.
#
# После включения TLS добавьте в server-блок 443 заголовок HSTS:
#   add_header Strict-Transport-Security "max-age=63072000" always;
# (includeSubDomains — только если ВСЕ поддомены работают по HTTPS)
# =============================================================================

# Ограничение частоты запросов к API на уровне nginx (первая линия обороны)
limit_req_zone $binary_remote_addr zone=bastur_api:10m rate=10r/s;

# ---------------------------------------------------------------------------
# Микрокеш HTML для анонимных посетителей.
# Все публичные страницы рендерятся динамически (force-dynamic → запрос в БД),
# поэтому кеш на 5 секунд снимает основную нагрузку при всплесках трафика,
# оставляя контент практически мгновенно свежим после правок в админке.
# Запросы с админ-кукой (bastur_admin) кеш обходят полностью.
# ---------------------------------------------------------------------------
proxy_cache_path /var/cache/nginx/bastur levels=1:2 keys_zone=bastur_html:10m
                 max_size=256m inactive=10m use_temp_path=off;

# Сжатие текстовых ответов (HTML/CSS/JS/JSON/SVG).
# "gzip on;" не дублируем — он уже включён в /etc/nginx/nginx.conf (Ubuntu default).
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_types text/plain text/css text/xml application/json application/javascript
           application/xml application/rss+xml image/svg+xml font/woff2;

server {
    listen 80;
    listen [::]:80;
    server_name testnetnext.top www.testnetnext.top bus-tour.by www.bus-tour.by;

    # Максимальный размер загрузки (фото/видео в админке)
    client_max_body_size 512m;

    # Реальный IP клиента для rate-limit'ов приложения
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $host;
    proxy_http_version 1.1;

    # Долгие загрузки медиа в админке
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Статика Next.js — агрессивный кэш (immutable-хэши в именах)
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Загруженные файлы — Range-стриминг проксируется как есть
    location /uploads/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_buffering off;
    }

    location /api/ {
        limit_req zone=bastur_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000;
    }

    # Админка — никогда не кешируется
    location /admin {
        proxy_pass http://127.0.0.1:3000;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;

        # --- Микрокеш анонимного HTML (5 секунд) ---
        proxy_cache bastur_html;
        proxy_cache_valid 200 5s;
        proxy_cache_key "$scheme$host$request_uri";
        proxy_cache_methods GET HEAD;
        # Обход кеша: залогиненный админ и любые не-GET запросы
        proxy_cache_bypass $cookie_bastur_admin;
        proxy_no_cache $cookie_bastur_admin;
        # Не отдавать одному пользователю Set-Cookie другого
        proxy_ignore_headers Set-Cookie;
        proxy_hide_header Set-Cookie;
        # При падении бэкенда отдаём последнюю удачную копию
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status;
    }
}
