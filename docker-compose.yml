services:
  postgres:
    image: postgres:17-alpine
    container_name: bastur_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bastur}
      POSTGRES_USER: ${POSTGRES_USER:-bastur}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bastur_dev_password}
    volumes:
      - bastur_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  bastur-app:
    image: bastur-app-local:dev
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://31.77.228.133:3000}
        NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${NEXT_PUBLIC_RECAPTCHA_SITE_KEY:-}
    container_name: bastur_app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      PORT: 3000
      NODE_ENV: production
      BASTUR_DEPLOY_ENV: ${BASTUR_DEPLOY_ENV:-dev}
      MEDIA_SKIP_WEBP: ${MEDIA_SKIP_WEBP:-1}
      HOSTNAME: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-bastur}:${POSTGRES_PASSWORD:-bastur_dev_password}@postgres:5432/${POSTGRES_DB:-bastur}
    volumes:
      - bastur_uploads:/app/public/uploads
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  bastur-media-worker:
    image: bastur-app-local:dev
    container_name: bastur_media_worker
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      BASTUR_DEPLOY_ENV: ${BASTUR_DEPLOY_ENV:-dev}
      MEDIA_SKIP_WEBP: ${MEDIA_SKIP_WEBP:-1}
      DATABASE_URL: postgresql://${POSTGRES_USER:-bastur}:${POSTGRES_PASSWORD:-bastur_dev_password}@postgres:5432/${POSTGRES_DB:-bastur}
      MEDIA_WORKER_POLL_MS: ${MEDIA_WORKER_POLL_MS:-3000}
      MEDIA_WORKER_LEASE_MS: ${MEDIA_WORKER_LEASE_MS:-120000}
    volumes:
      - bastur_uploads:/app/public/uploads
    command: ["./node_modules/.bin/tsx", "scripts/media-worker.ts"]

volumes:
  bastur_uploads:
  bastur_postgres:
